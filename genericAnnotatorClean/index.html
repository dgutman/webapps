<!DOCTYPE html>

<head>
    <title>A-Beta Bounding Boxes</title>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.min.css"
        integrity="sha512-ELV+xyi8IhEApPS/pSj66+Jiw+sOT1Mqkzlh8ExXihe4zfqbWkxPRi8wptXIO9g73FSlhmquFlUOuMSoXz5IRw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script type="text/javascript"
        src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
    <!-- <script type="text/javascript" src="../lib/openseadragon/build/openseadragon/openseadragon.js"></script> -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.js"></script>
    <script type="module" src="./app.mjs"></script>
    <link rel="stylesheet" href="./dsa/dsa.css">
    <link rel="stylesheet" href="./dsa/dsauserinterface.css">
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./apps/bbox.css">

</head>

<body>
    <div class="content">
        <div id="header">
            <div class="dsa-ui-container"></div>
            <div id="annotation-controls">

            </div>
            <div id="magnification-controls">
                <button id="zoom1x">1x</button>
                <button id="zoom5x">5x</button>
                <button id="zoom10x">10x</button>
                <button id="zoom20x">20x</button>
            </div>
            <div class="hotkey-info">
                <small>Hotkeys: <strong>B</strong> = instant rectangle at cursor | <strong>R</strong> = toggle click
                    mode</small>
            </div>
            <div id="mouse-coords" class="mouse-coords">
                <small>Mouse: <span id="mouse-x">--</span>, <span id="mouse-y">--</span></small>
            </div>
        </div>
        <div id="viewer-container">
            <div id='viewer' class="viewer"></div>
        </div>
    </div>
</body>
